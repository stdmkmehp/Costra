# Costra 分类定义（一级 + 二级）
# 修改后告诉我，我会同步更新到：
#   1. server/db/migrations/0008_categories_hierarchy_seed.sql（权威源）
#   2. miniprogram/services/categoryService.ts getFallbackItems()（前端降级兜底）
#   3. server/test/categories-shared-type.test.ts（测试断言数量）
#
# 字段说明：
#   name:              分类名称
#   icon:              单字符图标（过渡方案，未来改为语义 ID + icon map）
#   color:             颜色 token（如 color.category.food）
#   sort_order:        排序权重（越小越靠前）
#   is_direct_default: 是否为直选默认归属（仅二级有效）
#                      同名二级出现在多个一级下时，只有最日常/高频的那个设为 true
#
# 规则：
#   - 一级分类 is_direct_default 永远为 false
#   - 二级分类 is_direct_default=true 表示记账时该名称默认归属到此父级
#   - 例：用户选"零食"→ 默认归入"餐饮-零食"(true)，而非"购物-零食"(false)

