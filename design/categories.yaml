# Costra 分类定义（一级 + 二级）
# 修改后告诉我，我会同步更新到：
#   1. server/db/migrations/0001_init.sql（幂等基线 · UPSERT）
#   2. server/db/migrations/0004_categories_restructure.sql（本次增量 · 删/增/重排）
#   3. miniprogram/services/categoryService.ts CONFIG_EXPENSE/CONFIG_INCOME/CONFIG_TRANSFER（前端降级兜底）
#   4. server/test/categories-shared-type.test.ts（测试断言数量）
#
# 字段说明：
#   name:              分类名称
#   icon:              语义 icon_key（端侧经 iconMap 映射为 costra-icons 字体字形）
#                      本文件仅在一级节点标注 icon_key；二级各节点的 icon_key（含去重复用：
#                      多个节点复用同一字形）以下列为权威，不在此逐节点展开：
#                        · scripts/icon-font/icon-registry.json（icon_key → 码点）
#                        · server/db/migrations/0007_category_icon_keys.sql（DB 权威映射）
#                        · miniprogram/services/categoryService.ts CONFIG_*（前端 fallback）
#                        · docs/design/category-icon-migration-plan.md §2/§3（设计说明）
#   color:             颜色 token（如 color.category.food）
#   sort_order:        排序权重（越小越靠前）
#   is_direct_default: 是否为直选默认归属（仅二级有效）
#                      同名二级出现在多个一级下时，只有最日常/高频的那个设为 true
#   display_order:     全局二级展示区展示顺序（NULL=不展示）
#
# 规则：
#   - 一级分类 is_direct_default 永远为 false
#   - 二级分类 is_direct_default=true 表示记账时该名称默认归属到此父级
#   - 例：用户选"零食"→ 默认归入"餐饮-零食"(true)，而非"购物-零食"(false)
#
# 类型说明（type 维度，与 entry_type 对齐）：
#   - expense / income：日常支出/收入
#   - transfer：资金在自己账户间流转（先充后花、账户互转、赊销），不计入收支统计
#
# 注：现有「支出·转账」(转账/还贷/垫付) 与新「转移」(transfer) 并存，语义不同：
#     支出·转账 = 钱真转给别人/还贷算支出
#     转移      = 钱仍是自己的，不计收支
#
# ⚠️ 二级分类「展开顺序」（运行时 sort_order）：
#   本文件中各二级的 sort_order 仅为"结构基线"。运行时二级 sort_order 的最终顺序
#   由 migration 0006_categories_sort_order_by_display.sql 按 display_order 派生重排：
#     ① 父默认子置顶 ② 按 COALESCE(自身 display_order, 同名 canonical display_order) 升序
#     ③ 无 display_order 的长尾按原 sort_order 垫底
#   即"点开一级分类后展开的二级分类"高频在前、与全局展示区口径一致。
#   详见 docs/design/categories-sort-order-by-display-spec.md。
#   （类比：display_order 的最终值由 0004 Step E 重排，本文件 display_order 同为基线。）

