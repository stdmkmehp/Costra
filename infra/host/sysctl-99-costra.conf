# =============================================================================
# Costra · 宿主机内核参数（安装为 /etc/sysctl.d/99-costra.conf）
# =============================================================================
# 落地基线：docs/ops/host-kernel-tuning.md
# 安装方式：infra/scripts/apply-host-tuning.sh apply（幂等 · 支持 --dry-run）
#
# 【设计原则】只收录"在宿主机设置才有效、且当前机型（2核4G · Docker 四服务栈）
# 有实际收益"的参数。两类被刻意排除：
#   1) per-netns 的网络参数（somaxconn / tcp_max_syn_backlog / tcp_max_tw_buckets /
#      tcp_tw_reuse / tcp_keepalive_* / ip_local_port_range / slow_start_after_idle）
#      —— compose 默认 bridge 让每个容器持有独立 net namespace，新 netns 由内核
#      编译期默认值初始化，**不继承宿主机**。在宿主机设这些对业务链路完全无效，
#      要生效必须写进 compose 的 `sysctls:`（当前评估为负 ROI，见手册 §5/§6）。
#   2) 当前流量下收益为零或有反作用的项（overcommit_memory / file-max /
#      inotify.max_user_watches / rp_filter / netdev_max_backlog），逐条理由见手册 §5。
#
# 反之 vm.* 与 qdisc/拥塞控制属于全局（非 namespaced 或作用于宿主物理网卡），
# 容器流量最终都经宿主 eth0 发出，故本文件是它们的唯一且有效的生效点。
# =============================================================================

# --- 内存（高 ROI · 全局生效）---------------------------------------------
# swappiness=1：尽量不换出，但保留 OOM 前的最后缓冲。不用 0（0 会禁用交换、
# 反而让 OOM killer 更激进地杀 PG），也不用 10（从库机大量 swap 会拉长 WAL
# 回放延迟 → 更易触发 max_standby_streaming_delay → pg_dump 被取消，违反
# "从库绝不反向影响主库"红线）。PG 官方与主流 DBA 惯例。
vm.swappiness = 1

# dirty_ratio 默认 40 是桌面机取向：40% x 4G = 1.6GB 脏页积压后才强制刷盘，
# 届时整机 IO 阻塞（轻量云盘 IOPS 本就低，PG checkpoint 叠加 pg_dump 极易撞上）。
# 降到 15/5 让刷盘均匀化，不会更慢、只会更稳。四服务全部受益。
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# --- 拥塞控制（高 ROI · 作用于宿主物理网卡 · 容器出网流量同样受益）--------
# 用户端是微信小程序（移动网络 · 丢包率高于机房内网）。CUBIC 把丢包当拥塞信号，
# 在移动弱网下会过度退让；BBR 以带宽/RTT 建模，实测能显著改善弱网下的
# API 尾延迟与大响应体（如统计接口）传输时间。
# fq 是 BBR 的官方推荐配套 qdisc（提供 pacing）；机器默认 fq_codel 来自
# /usr/lib/sysctl.d/50-default.conf，加载顺序在本文件之前，故此处覆盖生效。
#
# ⚠️ 前置条件：内核需支持 bbr（apply-host-tuning.sh 会先检查
# net.ipv4.tcp_available_congestion_control 并尝试 modprobe tcp_bbr）。
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
