# =============================================================================
# Costra · certbot webroot 签证专用 nginx 配置（极简 · 用完即弃）
# =============================================================================
# 用途：首次部署时 · 临时 nginx 容器仅跑 80 端口 · 供 certbot http-01 challenge
# 使用方：07-issue-cert.sh（docker run --rm 临时容器加载此配置）
# 签完即停 · 不用于正式业务
#
# server_name = _  → 通配任意域名（Host header），一份配置同时支持 prod
# (costra.cloud) 与 staging (stg.costra.cloud) 签证。certbot 通过 -d 参数
# 声明域名 · 不依赖 nginx 里的 server_name 匹配。
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # certbot http-01 challenge（webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 拒绝一切非 ACME 请求（安全 · 不暴露任何内容）
    location / {
        return 444;
    }
}
