# =============================================================================
# Costra · prod docker compose 编排（v1.5 · 2026-05-25）
# =============================================================================
# 4 服务架构（Plan C · 决策见 prod-bootstrap.md §0 + §3-C）：
#   - postgres : PG 15 · 数据持久化 /data/pgsql
#   - redis    : Redis 7 · 数据持久化 /data/redis
#   - server   : Costra Fastify Node 20 · 自构建镜像
#   - nginx    : 反代 + TLS · 80/443
#
# 网络：默认 bridge（顶层 name: costra → 网络名 costra_default）
#       容器间用 service name 互通（server → postgres:5432 / redis:6379）
#       端口策略：DB/Redis 仅 127.0.0.1 暴露 · server 仅 8080 内部 · nginx 80/443 公网
#
# 数据持久化：bind mount 到宿主机 /data/* · 容器删了数据不丢
#
# 启动：cd /root/Costra/infra && docker compose -f docker-compose.prod.yml --env-file /data/conf/server.env up -d
# 停止：docker compose -f docker-compose.prod.yml down       # 不删卷
# 完全清理：docker compose -f docker-compose.prod.yml down -v  # ⚠️ 删命名卷（bind mount 仍在）
#
# 关联：
#   - server/Dockerfile（自构建 server 镜像）
#   - infra/nginx/conf.d/costra.cloud.conf.prod（prod 模板 · SSL 注释状态 · git 安全）
#   - infra/nginx/conf.d/costra.cloud.conf.staging（staging 模板 · 与 prod 仅差 server_name / 证书路径）
#   - /data/conf/nginx/costra.cloud.conf（live 运行时配置 · 由 05-start-stack.sh 按 COSTRA_DOMAIN 选源复制 · SSL 已启用 · 容器挂载此目录）
#   - /data/conf/server.env（DATABASE_URL / REDIS_URL / JWT_SECRET / WX_APP_SECRET）
#   - /data/conf/postgres.env（仅 PG 用 · POSTGRES_PASSWORD）
#   - prod-bootstrap-compose.md §3-C（部署手册）
# =============================================================================

# Compose v3.9 · 兼容 docker compose v2.x（推荐）
# 不写 version 字段 · 现代 docker compose 自动识别（避免 deprecated 警告）

# 显式 project name → 网络名锁定为 costra_default · 不随目录名变化
name: costra

services:
  # ===========================================================================
  # PostgreSQL 15 · 有状态 · 数据 bind mount 到 /data/pgsql
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: costra-postgres
    restart: unless-stopped

    # 仅 127.0.0.1 暴露 · 不进公网（D-009 §2.4 安全基线）
    # 追加内网网卡映射：供从库机器流复制连接（PG_PRIMARY_LAN_IP 在 server.env 定义）
    # 未定义时默认绑 127.0.0.2（环回 · 不对外 · 不影响 staging 等不启从库的环境）
    ports:
      - "127.0.0.1:5432:5432"
      - "${PG_PRIMARY_LAN_IP:-127.0.0.2}:5432:5432"

    environment:
      # POSTGRES_PASSWORD 从宿主机 /data/conf/server.env 注入（避免硬编码）
      POSTGRES_USER: costra
      POSTGRES_PASSWORD: ${PG_COSTRA_PW}
      POSTGRES_DB: costra
      # 触发 initdb 时执行的额外 SQL · 装 pgcrypto + citext 扩展（0001_init.sql 必需）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai

    volumes:
      # 数据目录 → 宿主机（容器删了数据不丢）
      - /data/pgsql:/var/lib/postgresql/data
      # 日志目录
      - /data/logs/postgres:/var/log/postgresql
      # 首次 initdb 自动跑 .sql 文件（postgres 镜像约定）
      # 仅首次启动 · 数据目录非空时跳过 · 我们用 docker-entrypoint-initdb.d 装扩展 + 跑 migration
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d:ro

    # 健康检查（让 server 等 PG ready 再启）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costra -d costra"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

    # PG 调优（小型 prod 推荐起步值 · FU-PROD-PG-TUNE 后续优化）
    # 复制相关参数（wal_level/max_wal_senders/max_replication_slots/hot_standby）走 PG15 默认
    # max_slot_wal_keep_size 是唯一必须显式设的护栏：防从库久挂 → 复制槽让主库 WAL
    # 无限堆积撑爆磁盘。超出上限后槽自动失效，从库恢复时重做 pg_basebackup 即可。
    #
    # 日志落盘：logging_collector=on 把 stderr 日志收集进 log_directory 文件
    # （宿主机 /data/logs/postgres），PG 运行日志不再进 docker logs。log_directory
    # 必须显式指向 /var/log/postgresql，否则会落到 $PGDATA/log（数据卷内）。
    # 固定文件名且关闭 PG 自身切分，由宿主机 logrotate 作为唯一轮转事实源；
    # 避免“日期文件 + wildcard copytruncate”留下永不淘汰的历史文件。
    command:
      - "postgres"
      - "-c"
      - "log_destination=stderr"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgresql"
      - "-c"
      - "log_filename=postgresql.log"
      - "-c"
      - "log_rotation_age=0"
      - "-c"
      - "log_rotation_size=0"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "password_encryption=scram-sha-256"
      - "-c"
      - "max_slot_wal_keep_size=10GB"

    # 资源限制（compose 单机部署）
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

    # docker json-file 仅保留：collector 启动前极早期 stderr 与 entrypoint 输出
    # （PG 运行日志本体已落到 /data/logs/postgres 文件）
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ===========================================================================
  # Redis 7 · 有状态 · AOF 持久化到 /data/redis
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: costra-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    environment:
      TZ: Asia/Shanghai

    volumes:
      - /data/redis:/data
      - /data/logs/redis:/var/log/redis

    # Redis 启动命令（密码从 env 注入 · AOF 开启 · maxmemory 限制）
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PW}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--bind"
      - "0.0.0.0"
      - "--protected-mode"
      - "yes"
      # 日志落盘固定文件（→ 宿主机 /data/logs/redis/redis.log）· redis 自身不做轮转，
      # 由宿主机 logrotate（costra-ops · copytruncate）作为唯一轮转事实源
      - "--logfile"
      - "/var/log/redis/redis.log"

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PW}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'

    # docker json-file 仅保留：redis 读取 --logfile 参数前的极早期 stdout
    # （运行日志本体已落到 /data/logs/redis/redis.log，由宿主机 logrotate 轮转）
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ===========================================================================
  # Costra Server · 无状态 · 自构建镜像（server/Dockerfile）
  # ===========================================================================
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: costra-server:latest
    container_name: costra-server
    restart: unless-stopped

    # 端口仅暴露给 nginx（同 compose 网络内）· 不暴露公网（也不暴露 127.0.0.1）
    expose:
      - "8080"

    # 环境变量（从 server.env 注入 · 注意 DATABASE_URL/REDIS_URL host 用 service name）
    env_file:
      - /data/conf/server.env

    # 覆盖 server.env 里的 host 字段（容器间用 service name · 不能用 127.0.0.1）
    environment:
      DATABASE_URL: postgres://costra:${PG_COSTRA_PW}@postgres:5432/costra
      REDIS_URL: redis://:${REDIS_PW}@redis:6379
      NODE_ENV: production
      TZ: Asia/Shanghai

    volumes:
      # 日志落盘目录：production 下 pino 写固定文件 /var/log/costra/server.log
      # → 宿主机 /data/logs/server · server 自身不做轮转，
      # 由宿主机 logrotate（costra-ops · copytruncate）作为唯一轮转事实源
      - /data/logs/server:/var/log/costra
      # 用户上传文件（头像等）· server 写入 · nginx 只读服务
      - /data/uploads:/var/costra/uploads
      # 账本导出/导入产物已 COS 化（cos-offload-phase1 v0.2 · 私有桶 + 30 天生命周期），
      # 原 /data/exports、/data/import-staging 两个 bind mount 已撤除

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # 用 node 内置 http 模块做 healthcheck · 不依赖 wget/curl（alpine 默认没装 curl · BusyBox wget 行为不一致）
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:8080/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

    # docker json-file 仅保留：进程级未捕获异常等直接 stderr
    # （运行日志本体已落到 /data/logs/server/server.log，由宿主机 logrotate 轮转）
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ===========================================================================
  # nginx · 反代 + TLS · 80/443 公网
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: costra-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    # 内核参数（容器 netns 内 · 见 docs/ops/host-kernel-tuning.md §6）
    # 为什么必须在这里声明而不是只靠宿主机 /etc/sysctl.d/99-costra.conf：
    #   tcp_congestion_control 是 per-netns 的。新 netns 创建时会继承 init_net
    #   当时的值，但 nginx 容器的 netns 早已创建 → 宿主机后来改成 bbr 对它无效。
    #   而面向微信小程序用户的 TCP 服务端 socket 就在本容器的 netns 内，
    #   拥塞控制算法由此处决定，不由数据包路径上的设备决定。
    #   四服务中只有 nginx 直面公网移动弱网，故只有它需要声明。
    #
    # 前置依赖：宿主机已加载 tcp_bbr 模块（内核模块全局共享，容器无法自行加载）。
    # 由 infra/scripts/apply-host-tuning.sh 负责 modprobe + modules-load.d 持久化。
    # 若宿主机未加载，此处会导致容器启动失败 —— 这是**期望行为**（fail fast，
    # 而不是静默回退 cubic 让人误以为已生效）。
    sysctls:
      - net.ipv4.tcp_congestion_control=bbr

    volumes:
      # 配置文件 · 使用 live 路径（/data/conf/nginx）而非 repo 模板（./nginx/conf.d）
      # 这样 git pull 不会覆盖已启用 SSL 的运行时配置
      # 模板 → live 的复制由 05-start-stack.sh 负责
      - /data/conf/nginx:/etc/nginx/conf.d:ro
      # certbot 签的 TLS 证书（在宿主机用 certbot 签 · 容器只读挂载）
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # webroot（certbot http-01 challenge 用 · ACME 续期）
      - /data/certbot/www:/var/www/certbot:ro
      - /data/logs/nginx:/var/log/nginx
      # 用户上传文件（头像等）· nginx 只读静态服务
      - /data/uploads:/data/uploads:ro

    environment:
      TZ: Asia/Shanghai

    depends_on:
      server:
        condition: service_healthy

    healthcheck:
      # 用 127.0.0.1 而非 localhost · alpine 容器 BusyBox wget 解析 localhost 优先 IPv6 · nginx 只 bind IPv4 会 refused
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

    # docker json-file 仅保留：nginx master/worker 进程级直接 stderr
    # （access/error 日志本体已落到 /data/logs/nginx/*.log，由宿主机 logrotate 轮转）
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

# =============================================================================
# 网络（默认 bridge · compose 自动建 · 不需手写）
# =============================================================================
# 顶层 name: costra → 自动创建 costra_default 网络（bridge driver）
# 容器间互通：通过 service name DNS（postgres / redis / server / nginx）
# 不暴露的 expose: 端口仅在内部网络可达 · 公网不可达
