name: costra-analyze

# ─────────────────────────────────────────────────────────────────────────────
# Costra Analyze · 独立 Docker Compose
# 与 prod 的 infra/docker-compose.prod.yml 完全隔离（见 spec §0.2）
#   - compose project name: costra-analyze
#   - 容器名: costra-analyze-pg / costra-analyze-node
#   - 端口:   127.0.0.1:15432
#   - DB/用户: analyze/analyze
#   - env 文件: /data/conf/analytics.env（ANALYTICS_ENV_FILE 可覆盖）· 经单文件
#     只读挂载映射为 analyzer 容器内 /app/.env，容器内脚本与 .mjs 统一读该路径
#
# 按需启停模式（v0.2.4 · 2026-08-14 · 与 standby 从库、staging 栈共机）：
#   - restart: "no"：宿主机重启后不自动拉起，仅由 analyze.sh / cron 触发
#   - analyze.sh 每次运行后 docker compose stop，释放 CPU/内存给同机其它栈
#   - deploy.resources.limits 封顶分析窗口峰值（PG 512M + node 256M）
#   - 调整 limits 时注意整机还叠加 staging 栈（3.0G）与 standby 从库（768M）
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:15
    container_name: costra-analyze-pg
    # 按需启停：仅分析窗口内运行 · 宿主机重启不自动拉起（见文件头注释）
    restart: "no"
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: ${PG_DB:-analyze}
      POSTGRES_USER: ${PG_USER:-analyze}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change_me}
    volumes:
      - analyze-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 资源封顶：数据量 MB 级 · 默认 shared_buffers=128M 足够 · 无需调优
    # 峰值预算见 docs/ops/pg-standby-backup.md §2.1（三栈并存资源配额）
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  analyzer:
    build:
      context: .
      dockerfile: Dockerfile.analyzer
    image: costra-analyze-node:local
    container_name: costra-analyze-node
    # 按需启停：仅分析窗口内运行 · 宿主机重启不自动拉起（见文件头注释）
    restart: "no"
    working_dir: /app
    volumes:
      - .:/app
      # env 单文件挂载（须排在 .:/app 之后做嵌套覆盖）：缺省 ./.env 供本机开发；
      # analyze.sh 会 export ANALYTICS_ENV_FILE（默认 /data/conf/analytics.env）
      - ${ANALYTICS_ENV_FILE:-./.env}:/app/.env:ro
      - ${DUMP_INBOX:-/tmp/costra-analyze-inbox}:${DUMP_INBOX:-/tmp/costra-analyze-inbox}:ro
      - ${REPORTS_DIR:-/tmp/costra-analyze-report}:${REPORTS_DIR:-/tmp/costra-analyze-report}
      - ${LOG_DIR:-/tmp/costra-analyze-logs}:${LOG_DIR:-/tmp/costra-analyze-logs}
    depends_on:
      postgres:
        condition: service_healthy
    # 资源封顶：node render + nodemailer + gunzip + psql 客户端 · 内存需求低
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  analyze-pg-data:
