    post:
      tags: [categories]
      summary: 创建自定义分类
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }

  # ============ entries ============
  /entries:
    get:
      tags: [entries]
      summary: 流水列表（游标分页）
      parameters:
        - name: ledger_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: from
          in: query
          description: 起始时间（ISO-8601 UTC）
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: category_id
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { type: string, enum: [income, expense, transfer] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/Entry' }
                  next_cursor:
                    type: string
                    nullable: true
    post:
      tags: [entries]
      summary: 新增流水
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /entries/{entry_id}:
    parameters:
      - name: entry_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [entries]
      summary: 流水详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [entries]
      summary: 修改流水（需带 version）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [entries]
      summary: 软删除流水
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
          description: 当前客户端持有的 entry version（乐观锁）
      responses:
        '204': { description: 成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ============ budgets ============
  # COSTRA-4xx · v2：删除/重建旧 budgets 表后契约更新为月度总预算
  /budgets:
    get:
      tags: [budgets]
      summary: 获取月度预算
      description: |
        返回指定 (ledger_id, month) 的预算信息：
          - amount_cents：用户设定的上限
          - spent_cents：服务端聚合的当月 expense 总和
          - remain_cents：amount_cents - spent_cents（可为负）

        未设置预算时返 404，客户端据此展示"预算 未设置"。
      parameters:
        - name: ledger_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '404':
          description: 未设置预算
          content:
            application/json:
              schema: { $ref: '#/components/responses/NotFound' }
    put:
      tags: [budgets]
      summary: 创建或修改月度预算
      description: |
        - 不传 version：创建预算（若已存在 → 转 update 走 latest）
        - 传 version：修改已存在的预算（乐观锁 · 失败返 409）

        幂等：客户端 outbox 重放时保证同 (ledger_id, month) 不会重复创建。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetUpsert' }
      responses:
        '200':
          description: 创建或修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '409':
          description: 版本冲突 · 客户端需重拉 version 后重试
          content:
            application/json:
              schema: { $ref: '#/components/responses/Conflict' }

  # ============ sync ============
  /sync/pull:
    get:
      tags: [sync]
      summary: 增量拉取实体变更
      security:
        - BearerAuth: []
      parameters:
        - name: family_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: since
          in: query
          required: true
          description: |
            上次同步水位（BIGINT change_seq · v1.2 升级）；首次拉取传 0
            v1.0/v1.1 用 ISO-8601 时间戳 · 已废弃 · 详见 sync-protocol.md §6.3 v1.2
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sync/push:
    post:
      tags: [sync]
      summary: 推批量（离线本地变更）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '200':
          description: OK（每条单独报告结果）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResponse' }

  # ============ reports ============
  /reports/monthly:
    get:
      tags: [reports]
      summary: 月度统计
      parameters:
        - name: ledger_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: true
          description: YYYY-MM（按用户 timezone 计算区间）
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyReport' }

  # ============ notifications ============
  /notifications/subscribe-template:
    post:
      tags: [notifications]
      summary: 记录小程序订阅消息授权
      description: |
        客户端 `wx.requestSubscribeMessage()` 通过后调用，登记一次授权凭证（scene + template_id）。
        COSTRA-020 Round-2 P1-3：服务端写入 `subscribe_message_jobs` 表作为"待发射令牌"，
        有效窗口 7 天，期间最多 1 次被预算告警/家庭动态/周报消费。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id, scene]
              properties:
                template_id: { type: string }
                scene:
                  type: string
                  enum: [budget_alert, family_activity, weekly_digest]
      responses:
        '201':
          description: 授权已登记
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscribeMessageJob' }

  # ============ legal ============
  # COSTRA-ICP（备案下证 2026-05-13）：腾讯云规范要求"显著位置可查"，
  # 后端纯 API 域名无 web 落地页，本端点充当程序化查询入口。
  /legal/icp:
    get:
      tags: [legal]
      summary: ICP 备案信息查询（公开 · 无鉴权）
      description: |
        返回当前服务备案号、小程序备案号、主体所在地、下证日期与工信部官方查询入口。
        客户端 / 文档站均应优先消费此端点（而非硬编码备案号）以保证唯一事实源。
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IcpInfo' }

  # ═══════════════════════════════════════════════════════════════════════════
  # T2 · 定时记账 · COSTRA-5xx（Sprint-4 · Epic-E）
  # 事实源：docs/design/recurring-entry-tech-spec.md v0.2.1 §5
  # ═══════════════════════════════════════════════════════════════════════════
  /recurring-entries:
    get:
      operationId: listRecurringEntries
      tags: [recurring]
      summary: 列出当前用户创建的定时（跟人不跟账本）
      description: |
        始终按 created_by = 当前用户过滤 · 不接受 ledger_id 参数
        协作账本 owner 也看不到成员的规则 · 反之亦然
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, paused, ended, auto_paused, all]
            default: all
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RecurringRule' }

    post:
      operationId: createRecurringEntry
      tags: [recurring]
      summary: 新建定时规则
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringRuleCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringRule' }
        '400': { description: INVALID_ARGUMENT }
        '403': { description: PERMISSION_DENIED (user not in ledger family) }
        '422': { description: BUSINESS_RULE_VIOLATION }

  /recurring-entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRecurringEntry
      tags: [recurring]
      summary: 详情 · 只能取自己创建的规则
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringRule' }
        '404': { description: NOT_FOUND (不返 403 · 防止越权探测) }

    patch:
      operationId: patchRecurringEntry
      tags: [recurring]
      summary: 编辑（乐观锁）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RecurringRuleUpdate'
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringRule' }
        '404': { description: NOT_FOUND }
        '409': { description: VERSION_CONFLICT }

    delete:
      operationId: deleteRecurringEntry
      tags: [recurring]
      summary: 软删除（历史 entry 不受影响）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: No Content }
        '404': { description: NOT_FOUND }
        '409': { description: VERSION_CONFLICT }

  /recurring-entries/{id}/pause:
    post:
      operationId: pauseRecurringEntry
      tags: [recurring]
      summary: 手动禁用 · status → paused
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringRule' }

  /recurring-entries/{id}/resume:
    post:
      operationId: resumeRecurringEntry
      tags: [recurring]
      summary: 手动启用 · status → active + 重算 next_run_at
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringRule' }

  /recurring-entries/{id}/copy:
    post:
      operationId: copyRecurringEntry
      tags: [recurring]
      summary: 复制规则（start_date 用今天 · end_date 清空）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringRule' }

  # ============ workday calendar ============
  # 事实源：docs/design/workday-recurring-tech-spec.md §7.2
  /workday-calendar/{year}:
    get:
      operationId: getWorkdayCalendar
      tags: [recurring]
      summary: 获取指定年份的节假日数据（放假日 + 调休补班日）
      description: |
        供小程序「每个工作日」周期在编辑页预览时做本地降级判定。
        数据来源 workday_calendars 表（由 fetch-holidays + import-holidays 脚本灌入）。
        无需鉴权（节假日数据非隐私）。
      security: []
      parameters:
        - name: year
          in: path
          required: true
          schema: { type: integer, minimum: 2020, maximum: 2099 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [year, holidays, workdays]
                properties:
                  year: { type: integer }
                  holidays:
                    type: array
                    description: 放假日 · MM-DD 格式
                    items: { type: string, pattern: '^\d{2}-\d{2}$' }
                  workdays:
                    type: array
                    description: 调休补班日 · MM-DD 格式
                    items: { type: string, pattern: '^\d{2}-\d{2}$' }
        '404':
          description: 该年份无数据

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FamilyId:
      name: family_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: |
        UUID v4。同一 `Idempotency-Key` + 相同 `body_hash` 在 24h 去重窗口内返回首次结果（原 HTTP 状态码与响应体）；
        同 key 但 body_hash 不一致时返回 **409 IDEMPOTENCY_KEY_MISMATCH**。
        详见 `docs/api/id-strategy.md §3`。

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未授权 / Token 失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 乐观锁冲突（version 不匹配）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConflictError' }

  schemas:
    ErrorCode:
      type: string
      description: |
        所有 4xx/5xx 响应的统一错误码。事实源见 docs/api/error-codes.md；
        TS 枚举镜像：server/src/errors/ErrorCode.ts。
        客户端必须以 code 判分支（而非 HTTP status）。
      enum:
        - INVALID_ARGUMENT
        - MALFORMED_JSON
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_MISMATCH
        - UNSUPPORTED_MEDIA_TYPE
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - REFRESH_TOKEN_INVALID
        - WX_CODE_INVALID
        - PERMISSION_DENIED
        - FAMILY_NOT_MEMBER
        - FAMILY_PERSONAL_NOT_DELETABLE
        - NOT_FOUND
        - VERSION_CONFLICT
        - DUPLICATE_RESOURCE
        - INVITE_EXPIRED
        - BUSINESS_RULE_VIOLATION
        - RATE_LIMITED
        - INTERNAL
        - UNAVAILABLE
        - TIMEOUT
        - NOT_IMPLEMENTED

    Error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          example: 'field "amount" must be > 0'
        trace_id:
          type: string
          description: 服务端追踪 ID（便于排障；4xx/5xx 必返回）
        details:
          type: object
          description: |
            可选附加信息。特定 code 约定结构：
            - INVALID_ARGUMENT: { field, value, constraint }
            - BUSINESS_RULE_VIOLATION: { rule: 'family_member_limit' | 'personal_family_not_invitable' | ... }
            - VERSION_CONFLICT: { entity, entity_id }
          additionalProperties: true

    ConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            server_version: { type: integer }
            server_record:
              type: object
              description: 服务端当前版本（客户端据此决定合并策略）
              additionalProperties: true

    AuthTokenPair:
      type: object
      required: [access_token, refresh_token, access_token_ttl_sec, refresh_token_ttl_sec, user, default_family_id, default_ledger_id]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        access_token_ttl_sec:
          type: integer
          description: access_token 自签发起的有效秒数（见 docs/api/ttl-policy.md）
          example: 7200
        refresh_token_ttl_sec:
          type: integer
          description: refresh_token 自签发起的有效秒数
          example: 2592000
        expires_in:
          type: integer
          deprecated: true
          description: '【已废弃】等价于 access_token_ttl_sec，保留至 v0.2 移除'
          example: 7200
        user: { $ref: '#/components/schemas/User' }
        default_family_id:
          type: string
          format: uuid
          description: |
            用户登录后的默认 family · 由 server 在首登时 atomic bootstrap 创建（"我的账本"）。
            客户端应在登录成功后写入 storage 作为 active_family_id 兜底（COSTRA-165 family-context service 锚点）。
            参考：ADR-0007 §5.6
        default_ledger_id:
          type: string
          format: uuid
          description: |
            默认 family 的唯一 ledger id（产品语义 family:ledger=1:1）。
            客户端记账时默认填充（COSTRA-165 home/entry 接入锚点）。

    User:
      type: object
      required: [id, nickname, has_completed_profile, created_at]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        avatar_url: { type: string, format: uri, nullable: true }
        timezone: { type: string, example: Asia/Shanghai }
        has_completed_profile:
          type: boolean
          description: 'COSTRA-158: 用户是否完成资料补全（首登 false · PATCH /users/me 成功后 true）'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Family:
      type: object
      required: [id, name, owner_id, kind, ledger_id, ledger_name, member_count, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner_id: { type: string, format: uuid }
        kind: { type: string, enum: [personal, shared], description: 'COSTRA-221: family kind（ADR-0007 §5.7.2）' }
        ledger_id: { type: string, format: uuid, description: 'COSTRA-221: 默认 ledger id（产品语义 family:ledger=1:1）' }
        ledger_name: { type: string, description: 'COSTRA-221: 默认 ledger 名称' }
        member_count: { type: integer, description: 'COSTRA-221: active member 数量' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    FamilyDetail:
      allOf:
        - $ref: '#/components/schemas/Family'
        - type: object
          properties:
            members:
              type: array
              items: { $ref: '#/components/schemas/FamilyMember' }

    FamilyMember:
      type: object
      required: [user_id, nickname, role, status, color_slot, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        nickname: { type: string, description: 'COSTRA-221: JOIN users 当前昵称' }
        avatar_url: { type: string, format: uri, nullable: true, description: 'COSTRA-221: JOIN users 当前头像' }
        role: { type: string, enum: [owner, member, viewer] }
        status: { type: string, enum: [active, left], description: 'COSTRA-221: left_at IS NULL → active; left_at IS NOT NULL → left' }
        color_slot:
          type: integer
          minimum: 0
          maximum: 7
          nullable: true
          description: |
            成员持久化配色槽位（migration 0012_family_members_color_slot）。
            **应用层强保证**：status=active → 必非 null；status=left → 必为 null（slot 已释放可被新人复用）。
            前端按此索引到 8 色莫兰迪色板，保证同 family 内 active 成员之间不撞色。
        joined_at: { type: string, format: date-time }
        left_at: { type: string, format: date-time, nullable: true, description: 'COSTRA-221: 退出时间; NULL = active' }

    FamilyInvite:
      type: object
      required: [id, family_id, invite_token, role, expires_at, share_url]
      properties:
        id: { type: string, format: uuid, description: 'COSTRA-221: invite record id' }
        family_id: { type: string, format: uuid, description: 'COSTRA-221: 所属 family id' }
        invite_token: { type: string }
        role: { type: string, enum: [member, viewer] }
        expires_at: { type: string, format: date-time }
        share_url:
          type: string
          description: 可在小程序内分享的短链（含 scene 参数）

    FamilySummary:
      type: object
      required: [family_id, family_name, family_kind, ledger_id, ledger_name, timezone, range_start, range_end, currency, totals, members, segments, shared, personal_by_member]
      description: |
        COSTRA-222 / COSTRA-300: 家庭财务聚合（月度或年度）。口径详见 GET /families/{family_id}/summary description。
      properties:
        family_id: { type: string, format: uuid }
        family_name: { type: string }
        family_kind: { type: string, enum: [personal, shared] }
        ledger_id: { type: string, format: uuid }
        ledger_name: { type: string }
        month: { type: string, nullable: true, description: 'YYYY-MM；当请求传 year 时为 null' }
        year: { type: string, nullable: true, description: 'YYYY；当请求传 month 时为 null' }
        timezone: { type: string, description: 'MVP 固定 Asia/Shanghai', example: Asia/Shanghai }
        range_start: { type: string, format: date-time, description: '区间起始 UTC（inclusive）；month 调用为该月，year 调用为整年' }
        range_end: { type: string, format: date-time, description: '区间结束 UTC（exclusive）；month 调用为该月，year 调用为整年' }
        currency: { type: string, example: CNY }
        totals:
          type: object
          required: [expense, income, balance, shared_expense, personal_expense, entry_count, skipped_unclassified_expense_count]
          properties:
            expense: { type: integer, format: int64, description: '总支出（cents）' }
            income: { type: integer, format: int64, description: '总收入（cents）' }
            balance: { type: integer, format: int64, description: '结余 = income - expense（cents，可为负）' }
            shared_expense: { type: integer, format: int64, description: '公共支出（cents，shared_type=shared）' }
            personal_expense: { type: integer, format: int64, description: '个人支出（cents，shared_type=personal）' }
            entry_count: { type: integer, description: '非删除 entry 数（income + expense，不含 transfer）' }
            skipped_unclassified_expense_count:
              type: integer
              description: 'shared_type IS NULL 的 expense 数量（不进入聚合，仅可观测）'
        members:
          type: array
          items: { $ref: '#/components/schemas/FamilySummaryMember' }
        segments:
          type: array
          items: { $ref: '#/components/schemas/FamilySummarySegment' }
        shared:
          type: object
          required: [expense, paid_contributions, categories]
          properties:
            expense: { type: integer, format: int64, description: '公共支出总额（cents）' }
            paid_contributions:
              type: array
              items: { $ref: '#/components/schemas/FamilyPaidContribution' }
            categories:
              type: array
              items: { $ref: '#/components/schemas/FamilyCategoryRankItem' }
        personal_by_member:
          type: array
          items: { $ref: '#/components/schemas/FamilyPersonalExpenseBlock' }

    FamilySummaryMember:
      type: object
      required: [user_id, nickname, avatar_url, role, status, color_slot, joined_at, personal_expense, paid_contribution, expense_count]
      description: |
        COSTRA-222: 家庭成员在月度聚合中的数据。
        expense_count 口径：该成员本月 expense entry 数（不含 income/transfer）。
      properties:
        user_id: { type: string, format: uuid }
        nickname: { type: string }
        avatar_url: { type: string, format: uri, nullable: true }
        role: { type: string, enum: [owner, member, viewer] }
        status: { type: string, enum: [active, left] }
        color_slot:
          type: integer
          minimum: 0
          maximum: 7
          nullable: true
          description: '同 FamilyMember.color_slot · status=active 必非 null，status=left 必为 null'
        joined_at: { type: string, format: date-time }
        left_at: { type: string, format: date-time, nullable: true }
        personal_expense: { type: integer, format: int64, description: '个人支出（cents，shared_type=personal 且 created_by=该成员）' }
        paid_contribution: { type: integer, format: int64, description: '对公共支出的付款贡献（cents，shared_type=shared 且 created_by=该成员）' }
        expense_count: { type: integer, description: '该成员本月 expense entry 数（含 shared + personal，不含 income/transfer）' }

    FamilySummarySegment:
      type: object
      required: [key, type, label, amount, ratio_bps]
      description: |
        COSTRA-222: 支出占比视窗段。key='shared' 为公共段；key='member:{user_id}' 为成员个人段。
      properties:
        key: { type: string, description: "'shared' 或 'member:{user_id}'" }
        type: { type: string, enum: [shared, personal] }
        label: { type: string, description: '展示用标签' }
        user_id: { type: string, format: uuid, nullable: true, description: '个人段对应的 user_id；公共段为 null' }
        amount: { type: integer, format: int64, description: '金额（cents）' }
        ratio_bps: { type: integer, minimum: 0, maximum: 10000, description: '占比万分比（amount / totals.expense * 10000，expense=0 时为 0）' }
        member_status: { type: string, enum: [active, left], nullable: true, description: '个人段的成员状态；公共段为 null' }

    FamilyPaidContribution:
      type: object
      required: [user_id, nickname, avatar_url, status, amount, ratio_bps]
      description: COSTRA-222: 公共支出垫付贡献
      properties:
        user_id: { type: string, format: uuid }
        nickname: { type: string }
        avatar_url: { type: string, format: uri, nullable: true }
        status: { type: string, enum: [active, left] }
        amount: { type: integer, format: int64, description: '贡献金额（cents）' }
        ratio_bps: { type: integer, minimum: 0, maximum: 10000, description: '占比万分比（amount / shared_expense * 10000，shared_expense=0 时为 0）' }

    FamilyPersonalExpenseBlock:
      type: object
      required: [user_id, nickname, avatar_url, status, amount, categories]
      description: COSTRA-222: 成员个人支出块
      properties:
        user_id: { type: string, format: uuid }
        nickname: { type: string }
        avatar_url: { type: string, format: uri, nullable: true }
        status: { type: string, enum: [active, left] }
        amount: { type: integer, format: int64, description: '个人支出总额（cents）' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/FamilyCategoryRankItem' }

    FamilyCategoryRankItem:
      type: object
      required: [category_id, category_name, amount, entry_count, ratio_bps]
      description: |
        COSTRA-222 / COSTRA-300: 分类排行项。

        **重构后语义**：family summary 接口返回的 categories 字段为 **L1 一级分类排行**：`category_id` 即一级分类 id，`parent_category_id` / `parent_category_name` 在该接口内**恒为 null**（已无父）。占比 ratio_bps 的基数：`shared.categories[i]` 以 `shared.expense` 为分母；`personal_by_member[i].categories[j]` 以该成员 amount 为分母。
      properties:
        category_id: { type: string, format: uuid, nullable: true, description: 'null 表示未分类' }
        category_name: { type: string }
        parent_category_id: { type: string, format: uuid, nullable: true }
        parent_category_name: { type: string, nullable: true }
        amount: { type: integer, format: int64, description: '金额（cents）' }
        entry_count: { type: integer, description: '该分类下 entry 数' }
        ratio_bps: { type: integer, minimum: 0, maximum: 10000, description: '占比万分比' }

    SummaryDrillDownEntryItem:
      type: object
      required: [entry_id, amount, occurred_at, created_by, nickname, category_name, source_recurring_id]
      description: 'COSTRA-302: summary drill-down 流水明细项'
      properties:
        entry_id: { type: string, format: uuid }
        amount: { type: integer, format: int64, description: '金额（cents）' }
        note: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time, description: 'UTC ISO' }
        shared_type: { type: string, enum: [shared, personal], nullable: true }
        source_recurring_id:
          type: string
          format: uuid
          nullable: true
          description: '来源定时规则；手工流水为 null，用于“定”角标'
        created_by: { type: string, format: uuid }
        nickname: { type: string }
        avatar_url: { type: string, nullable: true }
        category_name: { type: string, description: 'entry 所属二级（叶子）分类名；前端在备注区回退展示' }

    SummaryDrillDownResponse:
      type: object
      required: [l1_category_id, l1_category_name, l1_amount, items, total_count, has_more]
      description: 'COSTRA-302: 协作页家庭汇总 L1 一级分类下钻流水明细'
      properties:
        l1_category_id: { type: string, format: uuid }
        l1_category_name: { type: string }
        l1_amount: { type: integer, format: int64, description: '该一级分类在此 shared_type(+user) 口径下的总额（cents）' }
        items:
          type: array
          items: { $ref: '#/components/schemas/SummaryDrillDownEntryItem' }
        total_count: { type: integer }
        has_more: { type: boolean }

    StatCategoryRankItem:
      type: object
      required: [category_id, category_name, icon, amount, entry_count, ratio_bps]
      description: 'COSTRA-224: 统计页通用分类排行项（用于 L1/L2 排行 + 月/年通用）'
      properties:
        category_id:
          type: string
          format: uuid
          nullable: true
          description: 'L1 时为 parent_id；L2 时为 category_id；null 表示未分类（应不出现）'
        category_name: { type: string }
        icon: { type: string, description: '语义 icon_key，与 Category.icon 同源，端侧经 iconMap 映射为 costra-icons 字形；旧数据可能为单字符，客户端需兜底' }
        amount: { type: integer, format: int64, description: '金额（cents）' }
        entry_count: { type: integer }
        ratio_bps: { type: integer, minimum: 0, maximum: 10000, description: '占比万分比（基数因层级而异：L1 = 总支出 / L2 = 父级总额）' }

    StatTotals:
      type: object
      required: [expense, income, balance, entry_count]
      properties:
        expense: { type: integer, format: int64 }
        income: { type: integer, format: int64 }
        balance: { type: integer, format: int64, description: 'income - expense' }
        entry_count: { type: integer }

    DailyTrendItem:
      type: object
      required: [day, expense, income]
      properties:
        day: { type: integer, minimum: 1, maximum: 31 }
        expense: { type: integer, format: int64 }
        income: { type: integer, format: int64 }

    MonthlyExtremes:
      type: object
      required: [avg_daily_expense, max_single_expense, max_day_expense]
      properties:
        avg_daily_expense: { type: integer, format: int64, description: '日均支出 = expense / 当月天数' }
        max_single_expense: { type: integer, format: int64 }
        max_day_expense: { type: integer, format: int64, description: '当月单日最高支出' }

    MonthlyStatistics:
      type: object
      required: [family_id, family_name, family_kind, ledger_id, ledger_name, month, timezone, range_start, range_end, currency, totals, daily_trend, extremes, category_ranks, filtered_user_id]
      description: 'COSTRA-224/260: 月度统计响应'
      properties:
        family_id: { type: string, format: uuid }
        family_name: { type: string }
        family_kind: { type: string, enum: [personal, shared] }
        ledger_id: { type: string, format: uuid }
        ledger_name: { type: string }
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        timezone: { type: string, enum: [Asia/Shanghai] }
        range_start: { type: string, format: date-time }
        range_end: { type: string, format: date-time }
        currency: { type: string, enum: [CNY] }
        filtered_user_id:
          type: string
          format: uuid
          nullable: true
          description: '当前结果的成员维度（null 表示"全部"）· COSTRA-260'
        totals: { $ref: '#/components/schemas/StatTotals' }
        daily_trend:
          type: array
          description: '当月每日趋势 · 长度 = 当月天数（28~31）'
          items: { $ref: '#/components/schemas/DailyTrendItem' }
        extremes: { $ref: '#/components/schemas/MonthlyExtremes' }
        category_ranks:
          type: array
          description: 'L1 一级分类排行 · 金额降序'
          items: { $ref: '#/components/schemas/StatCategoryRankItem' }

    MonthlyTrendItem:
      type: object
      required: [month, expense, income, balance, entry_count]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        expense: { type: integer, format: int64 }
        income: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }
        entry_count: { type: integer }

    YearlyExtremes:
      type: object
      required: [avg_monthly_expense, max_single_expense, max_month_expense, max_month_label, top_category_amount]
      properties:
        avg_monthly_expense: { type: integer, format: int64, description: '月均 = 总支出 / 已过月份数' }
        max_single_expense: { type: integer, format: int64 }
        max_month_expense: { type: integer, format: int64 }
        max_month_label: { type: string, description: '如「8月」· 无数据时空串' }
        top_category_name: { type: string, nullable: true }
        top_category_amount: { type: integer, format: int64 }

    YearlyStatistics:
      type: object
      required: [family_id, family_name, family_kind, ledger_id, ledger_name, year, timezone, range_start, range_end, currency, totals, monthly_trend, extremes, category_ranks, filtered_user_id]
      description: 'COSTRA-224/260: 年度统计响应'
      properties:
        family_id: { type: string, format: uuid }
        family_name: { type: string }
        family_kind: { type: string, enum: [personal, shared] }
        ledger_id: { type: string, format: uuid }
        ledger_name: { type: string }
        year: { type: string, pattern: '^\d{4}$' }
        timezone: { type: string, enum: [Asia/Shanghai] }
        range_start: { type: string, format: date-time }
        range_end: { type: string, format: date-time }
        currency: { type: string, enum: [CNY] }
        filtered_user_id:
          type: string
          format: uuid
          nullable: true
          description: '当前结果的成员维度（null 表示"全部"）· COSTRA-260'
        totals: { $ref: '#/components/schemas/StatTotals' }
        monthly_trend:
          type: array
          description: '12 月趋势 · 长度恒为 12'
          items: { $ref: '#/components/schemas/MonthlyTrendItem' }
        extremes: { $ref: '#/components/schemas/YearlyExtremes' }
        category_ranks:
          type: array
          items: { $ref: '#/components/schemas/StatCategoryRankItem' }

    DrillDownLevel2Response:
      type: object
      required: [level, parent_category_id, parent_category_name, parent_amount, items, total_count, has_more]
      properties:
        level: { type: integer, enum: [2] }
        parent_category_id: { type: string, format: uuid }
        parent_category_name: { type: string }
        parent_amount: { type: integer, format: int64, description: '一级分类总额（用于二级占比基数）' }
        items:
          type: array
          items: { $ref: '#/components/schemas/StatCategoryRankItem' }
        total_count: { type: integer }
        has_more: { type: boolean }

    DrillDownEntryItem:
      type: object
      required: [entry_id, amount, occurred_at, created_by, nickname, source_recurring_id]
      properties:
        entry_id: { type: string, format: uuid }
        amount: { type: integer, format: int64 }
        note: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }
        shared_type: { type: string, enum: [shared, personal], nullable: true }
        source_recurring_id:
          type: string
          format: uuid
          nullable: true
          description: '来源定时规则；手工流水为 null，用于“定”角标'
        created_by: { type: string, format: uuid }
        nickname: { type: string }
        avatar_url: { type: string, nullable: true }

    DrillDownLevel3Response:
      type: object
      required: [level, category_id, category_name, category_amount, items, total_count, has_more]
      properties:
        level: { type: integer, enum: [3] }
        category_id: { type: string, format: uuid }
        category_name: { type: string }
        parent_category_id: { type: string, format: uuid, nullable: true }
        parent_category_name: { type: string, nullable: true }
        category_amount: { type: integer, format: int64, description: '二级分类总额' }
        items:
          type: array
          items: { $ref: '#/components/schemas/DrillDownEntryItem' }
        total_count: { type: integer }
        has_more: { type: boolean }

    Ledger:
      type: object
      required: [id, family_id, name, currency, created_at, version, balance_cents, balance_baseline_seq, balance_version]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string, example: CNY }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
        # COSTRA-4xx · 资产字段（migration 0012）
        balance_cents:
          type: integer
          format: int64
          description: 账本资产净值（分）· 用户可修改 · entries 变化时服务端自动累加
        balance_baseline_seq:
          type: integer
          format: int64
          description: |
            资产累加基线（entries.change_seq）。
            仅 change_seq > baseline_seq 的流水才叠加到 balance_cents。
            用户重锚资产后置为当时的 MAX(entries.change_seq)。
        balance_version:
          type: integer
          description: 资产独立乐观锁版本（独立于 ledgers.version，避免与账本名修改互相 conflict）

    # ---- accounts ----
    # COSTRA-020 Round-2 P0-1：对齐 DB schema §3.4 accounts 表
    Account:
      type: object
      required: [id, name, kind, currency, balance, is_archived, created_at, version]
      properties:
        id: { type: string, format: uuid }
        user_id:
          type: string
          format: uuid
          nullable: true
          description: 私有账户的归属用户；与 family_id 互斥（同一时刻只有一项非空）
        family_id:
          type: string
          format: uuid
          nullable: true
          description: 家庭账户的归属家庭；与 user_id 互斥
        name: { type: string, maxLength: 32 }
        kind:
          type: string
          enum: [cash, bank_card, credit_card, e_wallet, prepaid_card, other]
          description: 账户类型（与 DB schema §3.4 对齐）
        currency: { type: string, example: CNY }
        balance:
          type: integer
          format: int64
          description: 当前余额（单位：分；服务端基于流水聚合，客户端只读）
        icon: { type: string, nullable: true, description: 图标 key（Design Token 映射） }
        color: { type: string, nullable: true }
        sort_order: { type: integer, default: 0 }
        is_archived:
          type: boolean
          default: false
          description: 归档后不出现在记账默认下拉，但历史流水仍保留
        note: { type: string, maxLength: 200, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
        version: { type: integer }

    AccountCreate:
      type: object
      required: [name, kind, currency]
      description: |
        user_id 与 family_id 不在请求体中指定：
        - 若未传 family_id query/context → 归属当前 user（私有）
        - 若 path/query 指定 family_id → 归属该家庭（需成员权限）
      properties:
        family_id:
          type: string
          format: uuid
          nullable: true
          description: 指定则创建家庭账户；不传则创建当前用户私有账户
        name: { type: string, maxLength: 32 }
        kind:
          type: string
          enum: [cash, bank_card, credit_card, e_wallet, prepaid_card, other]
        currency: { type: string, default: CNY }
        initial_balance:
          type: integer
          format: int64
          default: 0
          description: 建账初始余额（分）；内部写入一条 type=adjust 的系统流水
        icon: { type: string }
        color: { type: string }
        sort_order: { type: integer }
        note: { type: string, maxLength: 200 }

    AccountUpdate:
      type: object
      required: [version]
      description: |
        可改字段：name / icon / color / sort_order / is_archived / note。
        `kind` 和 `currency` 不可修改（与 DB schema §3.4 约束一致）；
        `balance` 由流水聚合派生，永不可直接修改。
      properties:
        name: { type: string, maxLength: 32 }
        icon: { type: string }
        color: { type: string }
        sort_order: { type: integer }
        is_archived: { type: boolean }
        note: { type: string, maxLength: 200 }
        version: { type: integer, description: 当前服务端版本号 }

    Category:
      type: object
      required: [id, name, type, icon, sort_order, parent_id, is_direct_default, is_parent_default, display_order, children_count]
      properties:
        id: { type: string, format: uuid }
        family_id:
          type: string
          format: uuid
          nullable: true
          description: null 表示系统预设
        name: { type: string }
        type: { type: string, enum: [income, expense, transfer] }
        icon: { type: string, description: '语义 icon_key（端侧经 iconMap 映射为 costra-icons 字体字形；映射见 scripts/icon-font/icon-registry.json）' }
        color: { type: string, description: 色值 key }
        sort_order: { type: integer }
        is_system: { type: boolean }
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: |
            父分类 ID；NULL 表示一级分类。
            COSTRA-217 B1：二级分类体系，最多两层。
        is_direct_default:
          type: boolean
          description: |
            全局二级展示区直选默认归属标记。
            仅二级分类有意义（一级分类恒为 false）。
            同名二级分类在不同一级下时，只有最日常/最高频的那个为 true。
            COSTRA-217 B1：对齐 design/ui/category_dictionary.md §默认直选归属映射表。
        is_parent_default:
          type: boolean
          description: |
            "点父一级时自动选中的默认子分类"标记（migration 0013）。
            每个一级分类下最多一个（DB partial unique index 兜底）。
            UI 据此过滤"全局二级展示区"——is_parent_default=true 的子分类不在该区出现，
            因为用户点一级时已天然选中它。
            一级分类（parent_id IS NULL）恒为 false。
        display_order:
          type: integer
          nullable: true
          minimum: 1
          description: |
            全局二级展示区的展示顺序（migration 0013）。
            NULL = 不在全局展示区展示（含 is_parent_default=true 的子分类、同名重复中非主归属的副本等）。
            有值时按升序展示。支出（type=expense）与收入（type=income）各自独立编号空间。
            一级分类恒为 NULL。
        children_count:
          type: integer
          minimum: 0
          description: |
            一级分类下二级数量；二级分类为 0。
            客户端据此判断是否展示展开箭头。

    CategoryCreate:
      type: object
      required: [family_id, name, type, icon]
      properties:
        family_id: { type: string, format: uuid }
        name: { type: string, maxLength: 16 }
        type: { type: string, enum: [income, expense, transfer] }
        icon: { type: string }
        color: { type: string }
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: |
            父分类 ID；不传表示创建一级分类，传入表示创建二级分类。
            COSTRA-217 B1：家庭自定义分类不得绕过二级约束（最多两层）。
            is_direct_default 与 children_count 为服务端只读字段，不允许客户端在 Create/Update 中传入。

    Entry:
      type: object
      required: [id, ledger_id, amount, currency, type, occurred_at, created_by, created_at, version, source_recurring_id]
      properties:
        id: { type: string, format: uuid }
        ledger_id: { type: string, format: uuid }
        amount:
          type: integer
          format: int64
          description: 金额（单位：分；正整数，方向由 type 决定）
          example: 12345
        currency: { type: string, example: CNY }
        type: { type: string, enum: [income, expense, transfer] }
        category_id: { type: string, format: uuid, nullable: true }
        account_id:
          type: string
          format: uuid
          nullable: true
          description: |
            关联账户（income/expense 时的资金账户；transfer 时的转出账户）。
            COSTRA-020 Round-2 P0-1 新增，对齐 DB §3.4 accounts。
        to_account_id:
          type: string
          format: uuid
          nullable: true
          description: |
            仅 type=transfer 使用：转入账户。
            与 account_id 一起刻画跨账户转账，两边各派生一条聚合。
        note: { type: string, maxLength: 200, nullable: true }
        occurred_at:
          type: string
          format: date-time
          description: 发生时间（UTC）
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
        version: { type: integer }
        change_seq:
          type: integer
          format: int64
          description: |
            同步引擎一致性水位（v1.2 新增 · BUG-COSTRA-154）
            PG SEQUENCE entries_change_seq 严格单调递增 · 不依赖时钟
            sync/pull 用此字段推进 watermark · client 不直接使用（仅作调试）
            详见 sync-protocol.md §6.3 v1.2
        client_ref_id:
          type: string
          nullable: true
          description: 客户端离线本地 id，用于 sync/push 去重
        shared_type:
          type: string
          nullable: true
          enum: [personal, shared]
          description: |
            公共/个人支出标记（COSTRA-217 B2）。
            - expense: 允许 personal / shared；未传时由服务端默认
              - 单人 personal family 账本默认 personal
              - 多人 shared family 账本默认 shared
            - income: 不适用公共收入概念，必须为 NULL
            - transfer: 暂不进入公共/个人统计，必须为 NULL
            非法组合（如 type=income 且 shared_type=shared）服务端返回 BUSINESS_RULE_VIOLATION。
        source_recurring_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: 来源定时规则；手工流水为 null，用于客户端展示“定”角标

    EntryCreate:
      type: object
      required: [ledger_id, amount, type, occurred_at]
      properties:
        ledger_id: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, default: CNY }
        type: { type: string, enum: [income, expense, transfer] }
        category_id: { type: string, format: uuid }
        account_id:
          type: string
          format: uuid
          description: |
            income/expense 强烈建议提供（缺省走 ledger 默认账户）；
            transfer 时为转出账户（必填）。
        to_account_id:
          type: string
          format: uuid
          description: 仅 transfer 必填：转入账户（不得与 account_id 相同）
        note: { type: string, maxLength: 200 }
        occurred_at: { type: string, format: date-time }
        client_ref_id: { type: string }
        shared_type:
          type: string
          nullable: true
          enum: [personal, shared]
          description: |
            公共/个人支出标记（COSTRA-217 B2）。可选；缺省走服务端默认规则。
            仅 type=expense 时有效；income/transfer 时传入非 NULL 将被拒绝。

    EntryUpdate:
      type: object
      required: [version]
      description: |
        修改流水。注意：`type`（income/expense/transfer）**不可修改**，
        若需改变 type 请先 delete 再 create。DB 层有相同约束。
        COSTRA-020 Round-2 P1-4 明确此语义。
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        category_id: { type: string, format: uuid }
        note: { type: string, maxLength: 200 }
        occurred_at: { type: string, format: date-time }
        shared_type:
          type: string
          nullable: true
          enum: [personal, shared]
          description: |
            公共/个人支出标记（COSTRA-217 B2）。仅 type=expense 时可修改。
        version: { type: integer, description: 当前服务端版本号 }

    Budget:
      type: object
      required: [id, ledger_id, month, amount_cents, spent_cents, remain_cents, currency, version]
      description: |
        月度总预算（v2 · COSTRA-4xx）。
        仅 (ledger_id, month) 维度，不做分类预算。
        amount_cents = 用户设定上限；spent_cents = 服务端聚合的当月支出；
        remain_cents = amount_cents - spent_cents（可为负 = 超支）。
      properties:
        id: { type: string, format: uuid }
        ledger_id: { type: string, format: uuid }
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        amount_cents: { type: integer, format: int64, description: 预算上限（分） }
        spent_cents: { type: integer, format: int64, description: 当月已支出（分）· 服务端聚合 }
        remain_cents: { type: integer, format: int64, description: 剩余预算（分）· 可为负 }
        currency: { type: string, example: CNY }
        version: { type: integer }

    BudgetUpsert:
      type: object
      required: [ledger_id, month, amount_cents]
      properties:
        ledger_id: { type: string, format: uuid }
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        amount_cents: { type: integer, format: int64, minimum: 1, description: 预算上限（分） }
        version:
          type: integer
          nullable: true
          minimum: 1
          description: |
            可选 · 当前预算版本（乐观锁）。
            - 首次设置：不传或 null，服务端创建
            - 修改已存在的预算：传上次 GET 拿到的 version
            - 不传但已存在：服务端用 latest version 做 base，仍走 update 路径

    SyncPullResponse:
      type: object
      required: [watermark, has_more, categories_revision, changes]
      properties:
        watermark:
          type: integer
          format: int64
          description: |
            本次返回数据的最大 change_seq · 客户端下次作为 since
            v1.2 升级（BUG-COSTRA-154）：从 ISO 时间戳改为 BIGINT change_seq
            PG SEQUENCE 严格单调 · 不依赖时钟 · 详见 sync-protocol.md §6.3 v1.2
        has_more: { type: boolean }
        categories_revision:
          type: string
          description: |
            系统分类签名（migration 0004 配套 · spec §4）。
            客户端比对此值与本地缓存签名，不一致则绕过 24h TTL 强刷分类列表。
            签名规范：仅纳入 family_id IS NULL 且 deleted_at IS NULL 的行，
            按 sortOrder ASC + id localeCompare 排序，单条字段顺序
            id|parentId|name|icon|type|sortOrder|isDirectDefault(1/0)|isParentDefault(1/0)|displayOrder
            条目内 '|' 分隔，条目间 ';' 分隔。前端实现见
            miniprogram/services/categoryService.ts computeCategoriesSignature
        changes:
          type: object
          description: 分实体返回变更集（含软删）
          properties:
            entries:
              type: array
              items: { $ref: '#/components/schemas/Entry' }
            categories:
              type: array
              items: { $ref: '#/components/schemas/Category' }
            budgets:
              type: array
              items: { $ref: '#/components/schemas/Budget' }
            ledgers:
              type: array
              items: { $ref: '#/components/schemas/Ledger' }

    SyncPushRequest:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          maxItems: 200
          items:
            type: object
            required: [op, entity, client_ref_id, payload]
            properties:
              op: { type: string, enum: [create, update, delete] }
              entity: { type: string, enum: [entry, category, budget] }
              client_ref_id: { type: string, description: 客户端本地 id }
              base_version:
                type: integer
                nullable: true
                description: update/delete 时必填；客户端最后知晓的服务端版本
              payload:
                type: object
                additionalProperties: true
                description: |
                  实体 payload。entry payload 含 shared_type 可选字段（COSTRA-217 B2）：
                  - shared_type 缺省时走服务端默认规则
                  - 非法组合（type=income 且 shared_type=shared）服务端返回 BUSINESS_RULE_VIOLATION

    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [client_ref_id, status]
            properties:
              client_ref_id: { type: string }
              status: { type: string, enum: [ok, conflict, rejected] }
              server_id: { type: string, format: uuid, nullable: true }
              server_version: { type: integer, nullable: true }
              error: { $ref: '#/components/schemas/Error' }

    MonthlyReport:
      type: object
      required: [month, currency, total_income, total_expense, by_category]
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        currency: { type: string }
        total_income: { type: integer, format: int64 }
        total_expense: { type: integer, format: int64 }
        by_category:
          type: array
          items:
            type: object
            properties:
              category_id: { type: string, format: uuid, nullable: true }
              category_name: { type: string }
              type: { type: string, enum: [income, expense] }
              amount: { type: integer, format: int64 }
              ratio_bp:
                type: integer
                minimum: 0
                maximum: 10000
                description: |
                  占比（万分比，basis points；0~10000 表示 0%~100%）。
                  COSTRA-020 Round-2 P1-2：原 `ratio: float` 改为整数万分比，
                  避免 JS 双精度 vs JVM float 跨端序列化差异。
                  客户端展示时 = ratio_bp / 100（两位小数百分比）。
        daily_trend:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              income: { type: integer, format: int64 }
              expense: { type: integer, format: int64 }

    # ---- notifications ----
    # COSTRA-020 Round-2 P1-3：订阅消息 7 天时效 + 幂等刻画
    SubscribeMessageJob:
      type: object
      required: [job_id, scene, template_id, created_at, expires_at, remaining_quota, status]
      properties:
        job_id:
          type: string
          format: uuid
          description: 本次授权凭证 id；后续告警/动态/周报消费时通过 job_id 去重
        scene:
          type: string
          enum: [budget_alert, family_activity, weekly_digest]
        template_id: { type: string }
        user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: |
            授权有效截止（created_at + 7 天，遵循微信订阅消息官方时效）。
            超过后必须重新由用户触发授权，服务端发射时会校验并拒发。
        remaining_quota:
          type: integer
          minimum: 0
          description: 剩余可发射次数（当前 MVP 单次授权 = 1 条；保留字段以支持未来一次性多次）
        status:
          type: string
          enum: [pending, sent, expired, revoked]
          description: pending=可发；sent=已发；expired=超 7 天；revoked=用户撤回
        last_sent_at:
          type: string
          format: date-time
          nullable: true

    # ---- legal ----
    # COSTRA-ICP（备案下证 2026-05-13）：与 server/src/config/icp.ts ICP_INFO 严格同源
    IcpInfo:
      type: object
      required: [service, miniapp, subject, filedAt, verifyUrl]
      properties:
        service:
          type: string
          description: 后端服务备案号（域名 costra.cloud 主体备案）
          example: 沪ICP备2026017253号-2
        miniapp:
          type: string
          description: 小程序备案号
          example: 沪ICP备2026017253号-1X
        subject:
          type: string
          description: 备案主体所在地（行政区简称，与工信部公示一致）
          example: 上海
        filedAt:
          type: string
          format: date
          description: 下证日期（ISO date · YYYY-MM-DD）
          example: '2026-05-13'
        verifyUrl:
          type: string
          format: uri
          description: 工信部官方查询入口
          example: https://beian.miit.gov.cn/

    # ─── T2 · 定时记账 ─────────────────────────────────────────────
    # 事实源：docs/design/recurring-entry-tech-spec.md §5.1 · server/db/migrations/0011_recurring_entries.sql
    RecurringRule:
      type: object
      required:
        - id
        - ledger_id
        - created_by
        - type
        - amount
        - currency
        - period
        - execute_bucket
        - execute_hour
        - execute_minute
        - timezone
        - start_date
        - status
        - next_run_at
        - created_at
        - updated_at
        - version
      properties:
        id: { type: string, format: uuid }
        ledger_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        type: { type: string, enum: [income, expense, transfer] }
        amount: { type: integer, minimum: 1, description: "单位:分" }
        currency: { type: string, default: CNY }
        category_id: { type: string, format: uuid, nullable: true }
        account_id: { type: string, format: uuid, nullable: true }
        to_account_id: { type: string, format: uuid, nullable: true }
        note: { type: string, maxLength: 200, nullable: true }
        shared_type:
          type: string
          enum: [personal, shared]
          nullable: true
          description: "仅 expense 有值; income/transfer 必须为 null"
        period:
          type: string
          enum: [weekly, monthly, yearly, workday, daily]
          description: |
            "workday = 每个工作日（按法定节假日+调休补班判定）
             daily = 每 N 天（与 period_interval 组合，从 start_date 起算的纯算术节拍）"
        period_interval:
          type: integer
          minimum: 1
          default: 1
          description: "周期间隔倍数 · period=weekly+interval=3 表示每3周 · period=daily+interval=3 表示每3天 · yearly/workday 恒为1"
        days_of_week:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          minItems: 1
          maxItems: 7
          nullable: true
          description: "1=周一, 7=周日; weekly 用"
        days_of_month:
          type: array
          items: { type: integer, minimum: 1, maximum: 31 }
          minItems: 1
          maxItems: 14
          nullable: true
          description: "monthly 用"
        year_month_days:
          type: array
          items: { type: integer, minimum: 101, maximum: 1231 }
          minItems: 1
          maxItems: 12
          nullable: true
          description: "yearly 用; 元素 = month*100 + day. 例: 1/1→101, 12/25→1225"
        execute_bucket:
          type: string
          enum: [dawn, morning, afternoon, night]
          description: "用户选择的时段档位"
        execute_hour:
          type: integer
          minimum: 0
          maximum: 23
          readOnly: true
          description: "后端 assignBucketMinute 分配 · 内缩边界后落在窗口中段"
        execute_minute:
          type: integer
          minimum: 0
          maximum: 59
          readOnly: true
        timezone:
          type: string
          example: "Asia/Shanghai"
          description: "创建时快照自 users.timezone"
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        status:
          type: string
          enum: [active, paused, ended, auto_paused]
          readOnly: true
          description: "客户端通过 /pause 和 /resume 端点切换"
        next_run_at:
          type: string
          format: date-time
          readOnly: true
        last_run_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        last_run_status:
          type: string
          nullable: true
          readOnly: true
          description: "ok | ok_with_skipped | failed_* | auto_paused_after_3_failures"
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        version: { type: integer, minimum: 1, readOnly: true }

    RecurringRuleCreate:
      type: object
      required: [ledger_id, type, amount, period, execute_bucket, start_date]
      properties:
        ledger_id: { type: string, format: uuid }
        type: { type: string, enum: [income, expense, transfer] }
        amount: { type: integer, minimum: 1 }
        currency: { type: string, default: CNY }
        category_id: { type: string, format: uuid, nullable: true }
        account_id: { type: string, format: uuid, nullable: true }
        to_account_id: { type: string, format: uuid, nullable: true }
        note: { type: string, maxLength: 200, nullable: true }
        shared_type:
          type: string
          enum: [personal, shared]
          nullable: true
        period:
          type: string
          enum: [weekly, monthly, yearly, workday, daily]
          description: "workday = 每个工作日 · daily = 每 N 天（与 period_interval 组合）"
        period_interval:
          type: integer
          minimum: 1
          default: 1
          description: "周期间隔倍数 · yearly 恒为1"
        days_of_week:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          minItems: 1
          maxItems: 7
          nullable: true
        days_of_month:
          type: array
          items: { type: integer, minimum: 1, maximum: 31 }
          minItems: 1
          maxItems: 14
          nullable: true
        year_month_days:
          type: array
          items: { type: integer, minimum: 101, maximum: 1231 }
          minItems: 1
          maxItems: 12
          nullable: true
        execute_bucket:
          type: string
          enum: [dawn, morning, afternoon, night]
        timezone:
          type: string
          description: "可选 · 缺省用 users.timezone"
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }

    RecurringRuleUpdate:
      type: object
      description: "所有字段可选 · 至少带 version"
      properties:
        type: { type: string, enum: [income, expense, transfer] }
        amount: { type: integer, minimum: 1 }
        category_id: { type: string, format: uuid, nullable: true }
        account_id: { type: string, format: uuid, nullable: true }
        to_account_id: { type: string, format: uuid, nullable: true }
        note: { type: string, maxLength: 200, nullable: true }
        shared_type:
          type: string
          enum: [personal, shared]
          nullable: true
        period:
          type: string
          enum: [weekly, monthly, yearly, workday, daily]
        period_interval:
          type: integer
          minimum: 1
          description: "周期间隔倍数"
        days_of_week: { type: array, items: { type: integer }, nullable: true }
        days_of_month: { type: array, items: { type: integer }, nullable: true }
        year_month_days: { type: array, items: { type: integer }, nullable: true }
        execute_bucket:
          type: string
          enum: [dawn, morning, afternoon, night]
        timezone: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
