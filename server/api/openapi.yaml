  # ============ ledgers ============
  /ledgers:
    get:
      tags: [ledgers]
      summary: 账本列表
      parameters:
        - name: family_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ledger' }
    post:
      tags: [ledgers]
      summary: 创建账本
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [family_id, name]
              properties:
                family_id: { type: string, format: uuid }
                name: { type: string, maxLength: 32 }
                currency: { type: string, default: CNY }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ledger' }

  /ledgers/{ledger_id}/balance:
    get:
      tags: [ledgers]
      summary: 主动拉取账本资产
      description: |
        客户端主动拉取账本最新资产（明细页首屏即时校准）。
        与 sync-pull 下发的 ledgers[] 增量互为补充：首屏无需等 sync，主动拉最新值即时渲染。

        权限：用户必须是该账本所属 family 的 active 成员，否则 403。
      parameters:
        - name: ledger_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 拉取成功
          content:
            application/json:
              schema:
                type: object
                required: [balance_cents, balance_baseline_seq, balance_version]
                properties:
                  balance_cents: { type: integer, format: int64 }
                  balance_baseline_seq: { type: integer, format: int64 }
                  balance_version: { type: integer }
        '403':
          description: 非该 family 的 active 成员 · 越权读取
        '404':
          description: 账本不存在
    patch:
      tags: [ledgers]
      summary: 修改账本资产（重锚）
      description: |
        用户修改账本资产值。服务端会：
        1) 把 balance_cents 设为传入值
        2) 把 balance_baseline_seq 推进到当前 MAX(entries.change_seq)
           → "重锚之前的所有流水都已消化，之后的新流水才继续叠加"

        乐观锁：用 balance_version 判定冲突；失败返 409，客户端需重拉最新值后弹冲突弹窗。

        敏感字段策略：不允许并发写入静默胜出（对齐 conflict-strategy.md §敏感字段策略）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: ledger_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [balance_cents, balance_version]
              additionalProperties: false
              properties:
                balance_cents:
                  type: integer
                  format: int64
                  description: 新的资产净值（分）· 允许负数
                balance_version:
                  type: integer
                  minimum: 1
                  description: 客户端持有的当前 balance_version（乐观锁）
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                required: [balance_cents, balance_baseline_seq, balance_version]
                properties:
                  balance_cents: { type: integer, format: int64 }
                  balance_baseline_seq: { type: integer, format: int64 }
                  balance_version: { type: integer }
        '409':
          description: 版本冲突 · 客户端需重拉最新值后弹冲突弹窗
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, example: VERSION_CONFLICT }
                      details:
                        type: object
                        properties:
                          current_balance_version: { type: integer }
                          current_balance_cents: { type: integer, format: int64 }

  # ============ categories ============
  /categories:
