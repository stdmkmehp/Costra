openapi: 3.0.3
info:
  title: Costra API
  description: |
    Costra 家庭财务记账小程序 · 后端 RESTful 契约 v0.1

    **硬约束**（见 ADR-0004 / engineering-guidelines）：
    - 所有金额字段使用 **整数分**（`int64`），不使用浮点。
    - 所有时间字段使用 **ISO-8601 UTC**（`YYYY-MM-DDTHH:mm:ss.sssZ`），客户端本地化渲染。
    - 命名：JSON 字段统一 `snake_case`；客户端映射至 `camelCase` 由 MiniApp 负责。
    - 鉴权：JWT Bearer（access 2h / refresh 30d，见 `/auth/*`）。
    - 幂等：所有写操作必须携带 `Idempotency-Key` 请求头（UUID v4）。
    - 分页：游标分页 `cursor` + `limit`（默认 20，最大 100）。
    - 冲突：乐观锁 `version` 字段 + 409 Conflict（冲突策略见 `docs/api/conflict-strategy.md`）。
    - 审计：所有写操作由服务端记录 audit log（见 `docs/api/audit-log.md`）。
  version: 0.1.0-draft
  contact:
    name: Costra Backend Team
    url: https://github.com/costra/costra
  license:
    name: Internal
servers:
  - url: http://localhost:8080/v1
    description: 本地开发（docker-compose 起；开发工具"不校验合法域名"模式）
  - url: http://49.235.216.20:8080/v1
    description: 开发服务器（D-009 锁定公网 IP；ICP备案下证前临时开放）
  - url: https://stg.costra.cloud/v1
    description: 预发布（Sprint-4 启用 ·与prod 同规格 · 微信体验版打此后端 · infra/wechat/domains.md §1.1）
  - url: https://costra.cloud/v1
    description: 生产（D-009 §2.1 锁定主域 costra.cloud · D-023 prod 入口回归根域 · ICP 下证 2026-05-13）

tags:
  - name: auth
    description: 登录、Token 刷新、登出
  - name: users
    description: 用户画像
  - name: families
    description: 家庭 / 成员 / 邀请
  - name: accounts
    description: 资金账户（现金 / 银行卡 / 电子钱包等）
  - name: ledgers
    description: 账本
  - name: categories
    description: 分类
  - name: entries
    description: 流水（记账条目）
  - name: budgets
    description: 预算
  - name: sync
    description: 离线同步（拉增量 / 推批量）
  - name: reports
    description: 统计报表
  - name: notifications
    description: 订阅消息触发
  - name: legal
    description: 法务披露（ICP 备案 / 主体信息 · 公开端点）

security:
  - BearerAuth: []

paths:
  # ============ auth ============
  /auth/wx-login:
    post:
      tags: [auth]
      summary: 微信 code 换 Token
      description: 小程序 `wx.login()` 得到 `code` → 换取我方 access/refresh token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 微信 wx.login() 返回的 code
                encrypted_data:
                  type: string
                  description: 可选，getUserProfile 加密数据
                iv:
                  type: string
                  description: 可选，配合 encrypted_data
                client_fp:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '^[-A-Za-z0-9._:]+$'
                  description: 可选，客户端生成并持久化的设备指纹；服务端据此在登录时按设备回收旧会话
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出（使 refresh_token 失效）
      responses:
        '204': { description: 成功 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============ users ============
  /users/me:
    get:
      tags: [users]
      summary: 当前用户画像
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [users]
      summary: 更新当前用户资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 32 }
                avatar_url: { type: string, format: uri }
                timezone: { type: string, example: Asia/Shanghai }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/overview:
    get:
      tags: [users]
      summary: 当前用户宏观聚合（mine 页 · 跨所有账本）
      description: |
        返回当前用户跨所有账本的宏观计数（按 entries.created_by 聚合）。
        - entry_count：未删除流水总数
        - ledger_days：有记账记录的天数（occurred_at 在 Asia/Shanghai 时区下 DISTINCT date）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [entry_count, ledger_days]
                properties:
                  entry_count: { type: integer, minimum: 0, description: 未删除流水总数 }
                  ledger_days: { type: integer, minimum: 0, description: 有记账记录的天数（Asia/Shanghai） }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============ families ============
  /families:
    get:
      tags: [families]
      summary: 我所属的家庭列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Family' }
    post:
      tags: [families]
      summary: 创建家庭
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 32 }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Family' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /families/{family_id}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [families]
      summary: 家庭详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [families]
      summary: 更新家庭名称（任意 active 成员均可）
      description: |
        重命名账本对全体 active 成员开放（COSTRA-230 后续调整）：仅校验成员身份，需带 version 乐观锁。
        同步更新关联 ledger 的 name（family:ledger=1:1）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                name: { type: string, maxLength: 32 }
                version: { type: integer, description: 乐观锁 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Family' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [families]
      summary: 解散家庭（仅 owner，软删，需带 version）
      description: |
        COSTRA-221：仅 owner 可操作，需 querystring version 做乐观锁。所有家庭成员关联、账本、流水、预算均级联软删。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
          description: 当前客户端持有的 family version（乐观锁）
      responses:
        '204': { description: 成功 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /families/{family_id}/members:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [families]
      summary: 家庭成员列表（含 active + left）
      description: |
        COSTRA-221: 返回该 family 的所有成员（active + left）。
        active members 按 joined_at ASC 排列在前；left members 按 left_at DESC 排列在后。
        非 member 访问返回 403 FAMILY_NOT_MEMBER。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FamilyMember' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /families/{family_id}/invites:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      tags: [families]
      summary: 生成邀请口令
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [member, viewer]
                  default: member
                ttl_hours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  default: 24
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyInvite' }

  /families/invites/accept:
    post:
      tags: [families]
      summary: 接受邀请（通过邀请 token）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token]
              properties:
                invite_token: { type: string }
      responses:
        '200':
          description: 加入成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Family' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410':
          description: 邀请已过期 / 已使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /families/{family_id}/summary:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [families]
      summary: 家庭财务聚合（月度/年度 summary）
      description: |
        COSTRA-222 / COSTRA-300: 返回指定家庭某月或某年的财务聚合数据，包含总支出/收入/结余、
        公共/个人支出拆解、垫付贡献比例、成员个人支出、分类排行。

        调用模式：传 `month=YYYY-MM` 返回当月聚合；传 `year=YYYY` 返回当年聚合（与月度同口径，区间 12 个月）。两者互斥，必须恰传一个，违反返回 400 INVALID_ARGUMENT (details.reason='month_year_xor')。

        时区口径：MVP 固定 Asia/Shanghai (+08:00)。
        month=YYYY-MM 的闭区间 [start, end)：
          start = 当月 1 日 00:00:00 +08:00
          end   = 下月 1 日 00:00:00 +08:00
        year=YYYY 的闭区间 [start, end)：
          start = 当年 1 月 1 日 00:00:00 +08:00
          end   = 次年 1 月 1 日 00:00:00 +08:00
        SQL 使用 UTC timestamp 比较：[start_utc, end_utc)

        口径规则：
          - shared_type='shared' 的 expense → 公共支出
          - shared_type='personal' 的 expense → 成员个人支出
          - shared_type IS NULL 的 expense → 不进入聚合，登记 skipped_unclassified_expense_count
          - income 只进入 totals.income / totals.balance，不进入支出/分类排行
          - transfer 不进入任何聚合
          - 金额全程 integer cents，ratio 使用 basis points (0~10000)
      parameters:
        - name: month
          in: query
          required: false
          description: '月份（YYYY-MM，按 Asia/Shanghai 时区计算区间）。与 year 互斥，恰传一个。'
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: year
          in: query
          required: false
          description: '年份（YYYY，按 Asia/Shanghai 时区计算区间）。与 month 互斥，恰传一个。'
          schema: { type: string, pattern: '^\d{4}$' }
        - name: top_n
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 6 }
          description: 分类排行返回条数（默认 6，最大 20）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilySummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /families/{family_id}/summary/drill-down:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [families]
      summary: 协作页家庭汇总三级下钻（按一级分类展开流水明细）
      description: |
        COSTRA-302: 从 family summary 的 L1 一级分类排行下钻到流水明细。

        与统计页 drill-down 的区别：
          - 口径严格对齐 familySummaryRepo（公共 = shared_type='shared'；个人 = shared_type='personal' AND created_by=userId），
            保证「排行金额 = 下钻明细加总」不漂移。
          - l1_category_id 匹配「该一级分类本身 + 其所有子分类」的流水（因 foldToL1 折叠了二级到一级）。
          - 统计页 drill-down 是精确匹配单个 category_id 且 shared_type IS NOT NULL（不区分公共/个人），不可复用。

        month 与 year 互斥，恰传一个；shared_type 必填；shared_type='personal' 时 user_id 必填。
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          description: 'month 与 year 二选一'
        - name: year
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}$' }
        - name: l1_category_id
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: '一级分类 ID（来自 summary 排行的 category_id）'
        - name: shared_type
          in: query
          required: true
          schema: { type: string, enum: [shared, personal] }
          description: '公共 or 个人口径'
        - name: user_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 'shared_type=personal 时必填；shared 时忽略'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummaryDrillDownResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /families/{family_id}/statistics/monthly:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [families]
      summary: 月度统计（统计页主数据）
      description: |
        COSTRA-224: 返回指定家庭某月的统计数据，包含 totals + 日维度趋势 + 极限值 + 一级分类排行。

        时区固定 Asia/Shanghai。口径与 /summary 一致：
          - 仅 type='expense' AND shared_type IS NOT NULL 计入支出聚合
          - shared_type IS NULL 的 expense 不进入聚合（与 family summary 一致）
          - transfer 不计入
          - 已退出成员的历史 expense 仍计入（数据不可变原则）
        category_ranks：按 categories.parent_id 折叠的"一级分类"排行（金额降序，amount > 0，top_n 截断）。
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: top_n
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: user_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: '成员维度筛选 · 仅返回 entries.created_by = user_id 的数据 · 不传 = 全部'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyStatistics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /families/{family_id}/statistics/yearly:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [families]
      summary: 年度统计（统计页主数据）
      description: |
        COSTRA-224: 返回指定家庭某年的统计数据，包含 totals + 12 月维度趋势 + 极限值 + 一级分类排行。
        时区固定 Asia/Shanghai。口径与 monthly 一致。
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}$' }
        - name: top_n
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: user_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: '成员维度筛选 · 仅返回 entries.created_by = user_id 的数据 · 不传 = 全部'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearlyStatistics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /families/{family_id}/statistics/drill-down:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [families]
      summary: 统计排行下钻（L2 二级分类排行 / L3 单笔明细）
      description: |
        COSTRA-224: 三层下钻接口。

        - level=2：返回指定一级分类下的二级分类排行（按金额降序）
        - level=3：返回指定二级分类下的单笔明细（按 amount 降序，occurred_at 降序）

        month 与 year 互斥：传 month 表示按月范围、传 year 表示按年范围。
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          description: 'month 与 year 二选一'
        - name: year
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}$' }
        - name: level
          in: query
          required: true
          schema: { type: integer, enum: [2, 3] }
        - name: parent_category_id
          in: query
          required: false
          description: 'level=2 时必填'
          schema: { type: string, format: uuid }
        - name: category_id
          in: query
          required: false
          description: 'level=3 时必填'
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: user_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: '成员维度筛选 · 仅返回 entries.created_by = user_id 的数据 · 不传 = 全部'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DrillDownLevel2Response'
                  - $ref: '#/components/schemas/DrillDownLevel3Response'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /families/{family_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [families]
      summary: 移除成员（仅 owner）
      responses:
        '204': { description: 成功 }
        '403': { $ref: '#/components/responses/Forbidden' }

  /families/{family_id}/members/me/leave:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      tags: [families]
      summary: 当前用户主动离开 family
      description: |
        语义（COSTRA-229 / D-029）：
        - 非 owner：直接 setLeftAt(self)
        - owner 多人：单事务内移交所有权给最早加入的 active 成员（joined_at ASC）+ setLeftAt(self)
        - owner 仅一人：单事务内 softDelete(family) + setAllActiveLeftAt(family) → 自动解散
        - personal family：拒绝（403 FAMILY_PERSONAL_NOT_DELETABLE）
        - 已 left 重复调：assertActiveMember 拦截，返回 403 FAMILY_NOT_MEMBER（幂等语义）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 离开成功（已写 left_at；如触发自动解散，family 同事务软删） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 不是 active member 或 personal family 拒绝离开
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ============ accounts ============
  # COSTRA-020 Round-2 新增（P0-1）：覆盖 DB schema §3.4 accounts 表的 API 入口
  /accounts:
    get:
      tags: [accounts]
